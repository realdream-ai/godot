name: Build Android Runtime Artifact

on:
  workflow_call:
    inputs:
      runtime_version:
        required: true
        type: string
      godot_repository:
        required: true
        type: string
      godot_ref:
        required: true
        type: string
      spx_repository:
        required: true
        type: string
      spx_ref:
        required: true
        type: string
      common_args:
        required: true
        type: string
      release_args:
        required: true
        type: string

permissions:
  contents: read

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons_cache/

jobs:
  android-build:
    name: Android templates
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up external SPX module
        id: spx-source
        uses: ./.github/actions/setup-spx-module
        with:
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android NDK r23c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r23c
          add-to-path: true
          link-to-sdk: true
          local-cache: true

      - name: Export Android NDK environment
        shell: bash
        env:
          INSTALLED_NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          INSTALLED_NDK_VERSION: ${{ steps.setup-ndk.outputs.ndk-full-version }}
        run: |
          set -euo pipefail

          expected_version="23.2.8568313"
          if [ "${INSTALLED_NDK_VERSION}" != "${expected_version}" ]; then
            echo "[error] Android NDK version is ${INSTALLED_NDK_VERSION}; expected ${expected_version}" >&2
            exit 1
          fi
          if [ ! -d "${INSTALLED_NDK_PATH}" ]; then
            echo "[error] Android NDK path does not exist: ${INSTALLED_NDK_PATH}" >&2
            exit 1
          fi

          godot_ndk_path="${ANDROID_HOME}/ndk/${expected_version}"
          if [ ! -e "${godot_ndk_path}" ]; then
            echo "[error] Godot cannot find the linked Android NDK at ${godot_ndk_path}" >&2
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=${godot_ndk_path}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${godot_ndk_path}" >> "${GITHUB_ENV}"
          echo "[info] Godot Android NDK: ${godot_ndk_path}"

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: spx-runtime-android-${{ steps.spx-source.outputs.godot-sha }}-${{ steps.spx-source.outputs.module-sha }}
          restore-keys: |
            spx-runtime-android-${{ steps.spx-source.outputs.godot-sha }}-
            spx-runtime-android-

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          scons-version: 4.8.1

      - name: Build Android 32-bit debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=android target=template_debug arch=arm32
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: android
          target: template_debug

      - name: Build Android 32-bit release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=android target=template_release arch=arm32
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: android
          target: template_release

      - name: Build Android 64-bit debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=android target=template_debug arch=arm64
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: android
          target: template_debug

      - name: Build Android 64-bit release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=android target=template_release arch=arm64
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: android
          target: template_release

      - name: Generate Android templates
        working-directory: platform/android/java
        run: ./gradlew generateGodotTemplates

      - name: Package Android artifact
        shell: bash
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          zip -j artifacts/android.zip bin/android*.apk bin/android_source.zip
          echo "[info] Packaged Android runtime ${RUNTIME_VERSION}"
          unzip -l artifacts/android.zip

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-android
          path: artifacts/android.zip
          if-no-files-found: error
          retention-days: 14
