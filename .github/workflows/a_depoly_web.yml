name: Build Web Runtime Artifacts

on:
  workflow_call:
    inputs:
      runtime_version:
        required: true
        type: string
      runtime_abi:
        required: true
        type: string
      godot_repository:
        required: true
        type: string
      godot_ref:
        required: true
        type: string
      spx_repository:
        required: true
        type: string
      spx_ref:
        required: true
        type: string

permissions:
  contents: read

env:
  EM_CACHE_FOLDER: emsdk-cache

jobs:
  web-build:
    name: Web ${{ matrix.mode }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: editor
            mode: editor
            threads_flag: threads=no
            extra_flags: debug_symbols=no
            source_file: bin/godot.web.editor.wasm32.nothreads.zip
            output_file: editor-web.zip
            artifact_name: runtime-editor-web
          - target: template_release
            mode: normal
            threads_flag: threads=no
            extra_flags: ''
            source_file: bin/godot.web.template_release.wasm32.nothreads.zip
            output_file: web.zip
            artifact_name: runtime-web
          - target: template_release
            mode: threads
            threads_flag: threads=yes
            extra_flags: ''
            source_file: bin/godot.web.template_release.wasm32.zip
            output_file: web-threads.zip
            artifact_name: runtime-web-threads
          - target: template_release
            mode: worker
            threads_flag: threads=yes
            extra_flags: proxy_to_pthread=yes
            source_file: bin/godot.web.template_release.wasm32.zip
            output_file: web-worker.zip
            artifact_name: runtime-web-worker
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up SPX build context
        id: spx-build
        uses: ./.github/actions/setup-spx-module/build-context
        with:
          runtime-version: ${{ inputs.runtime_version }}
          runtime-abi: ${{ inputs.runtime_abi }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}
          toolchain-scope: web
          cache-scope: web-${{ matrix.mode }}

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.spx-build.outputs.emsdk-version }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
          cache-key: emsdk-${{ steps.spx-build.outputs.emsdk-version }}-${{ runner.os }}

      - name: Verify Emscripten installation
        run: emcc -v

      - name: Build Web ${{ matrix.mode }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ matrix.target == 'editor' && steps.spx-build.outputs.common-flags || steps.spx-build.outputs.template-release-flags }}
            ${{ matrix.threads_flag }} ${{ matrix.extra_flags }}
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: web
          target: ${{ matrix.target }}

      - name: Package Web artifact
        shell: bash
        env:
          SOURCE_FILE: ${{ matrix.source_file }}
          OUTPUT_FILE: ${{ matrix.output_file }}
          MODE: ${{ matrix.mode }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "${SOURCE_FILE}" "artifacts/${OUTPUT_FILE}"
          echo "[info] Packaged Web ${RUNTIME_VERSION} ${OUTPUT_FILE}"

          if [ "${MODE}" = normal ]; then
            cp "${SOURCE_FILE}" artifacts/web-minigame.zip
            cp "${SOURCE_FILE}" artifacts/web-miniprogram.zip
            echo "[info] Reused the normal no-threads build for minigame and miniprogram"
          fi

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.output_file }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Web minigame artifact
        if: matrix.mode == 'normal'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-web-minigame
          path: artifacts/web-minigame.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Web miniprogram artifact
        if: matrix.mode == 'normal'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-web-miniprogram
          path: artifacts/web-miniprogram.zip
          if-no-files-found: error
          retention-days: 14
