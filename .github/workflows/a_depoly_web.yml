name: Build Web Runtime Artifacts

on:
  workflow_call:
    inputs:
      runtime_version:
        required: true
        type: string
      godot_repository:
        required: true
        type: string
      godot_ref:
        required: true
        type: string
      spx_repository:
        required: true
        type: string
      spx_ref:
        required: true
        type: string
      common_args:
        required: true
        type: string
      release_args:
        required: true
        type: string

permissions:
  contents: read

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
  EM_VERSION: 3.1.62
  EM_CACHE_FOLDER: emsdk-cache

jobs:
  web-build:
    name: Web ${{ matrix.mode }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: editor
            mode: editor
            threads_flag: threads=no
            extra_flags: debug_symbols=no
            source_file: bin/godot.web.editor.wasm32.nothreads.zip
            output_file: editor-web.zip
            artifact_name: runtime-editor-web
          - target: template_release
            mode: normal
            threads_flag: threads=no
            extra_flags: ''
            source_file: bin/godot.web.template_release.wasm32.nothreads.zip
            output_file: web.zip
            artifact_name: runtime-web
          - target: template_release
            mode: threads
            threads_flag: threads=yes
            extra_flags: ''
            source_file: bin/godot.web.template_release.wasm32.zip
            output_file: web-threads.zip
            artifact_name: runtime-web-threads
          - target: template_release
            mode: worker
            threads_flag: threads=yes
            extra_flags: proxy_to_pthread=yes
            source_file: bin/godot.web.template_release.wasm32.zip
            output_file: web-worker.zip
            artifact_name: runtime-web-worker
          - target: template_release
            mode: minigame
            threads_flag: threads=no
            extra_flags: ''
            source_file: bin/godot.web.template_release.wasm32.nothreads.zip
            output_file: web-minigame.zip
            artifact_name: runtime-web-minigame
          - target: template_release
            mode: miniprogram
            threads_flag: threads=no
            extra_flags: ''
            source_file: bin/godot.web.template_release.wasm32.nothreads.zip
            output_file: web-miniprogram.zip
            artifact_name: runtime-web-miniprogram
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up external SPX module
        id: spx-source
        uses: ./.github/actions/setup-spx-module
        with:
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
          cache-key: emsdk-${{ env.EM_VERSION }}-${{ runner.os }}

      - name: Verify Emscripten installation
        run: emcc -v

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: spx-runtime-web-${{ matrix.mode }}-${{ steps.spx-source.outputs.godot-sha }}-${{ steps.spx-source.outputs.module-sha }}
          restore-keys: |
            spx-runtime-web-${{ matrix.mode }}-${{ steps.spx-source.outputs.godot-sha }}-
            spx-runtime-web-${{ matrix.mode }}-

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          scons-version: 4.8.1

      - name: Build Web ${{ matrix.mode }}
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=web target=${{ matrix.target }}
            ${{ matrix.threads_flag }} ${{ matrix.extra_flags }}
            ${{ inputs.common_args }}
            ${{ matrix.target == 'template_release' && inputs.release_args || '' }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: web
          target: ${{ matrix.target }}

      - name: Package Web artifact
        shell: bash
        env:
          SOURCE_FILE: ${{ matrix.source_file }}
          OUTPUT_FILE: ${{ matrix.output_file }}
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "${SOURCE_FILE}" "artifacts/${OUTPUT_FILE}"
          echo "[info] Packaged Web ${RUNTIME_VERSION} ${OUTPUT_FILE}"

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.output_file }}
          if-no-files-found: error
          retention-days: 14
