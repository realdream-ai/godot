name: Build macOS Runtime Artifacts

on:
  workflow_call:
    inputs:
      runtime_version:
        required: true
        type: string
      runtime_abi:
        required: true
        type: string
      godot_repository:
        required: true
        type: string
      godot_ref:
        required: true
        type: string
      spx_repository:
        required: true
        type: string
      spx_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  macos-editor-build:
    name: macOS ${{ matrix.arch }} editor
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up SPX build context
        id: spx-build
        uses: ./.github/actions/setup-spx-module/build-context
        with:
          runtime-version: ${{ inputs.runtime_version }}
          runtime-abi: ${{ inputs.runtime_abi }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}
          toolchain-scope: native
          cache-scope: macos-${{ matrix.arch }}-editor

      - name: Build macOS editor
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.editor-release-flags }}
            arch=${{ matrix.arch }}
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: macos
          target: editor

      - name: Package macOS editor
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "bin/godot.macos.editor.${{ matrix.arch }}"
          mkdir -p artifacts
          zip -j "artifacts/editor-macos-${{ matrix.arch }}.zip" "bin/godot.macos.editor.${{ matrix.arch }}"

      - name: Upload macOS editor artifact
        uses: actions/upload-artifact@v5
        with:
          name: runtime-editor-macos-${{ matrix.arch }}
          path: artifacts/editor-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  macos-template-build:
    name: macOS ${{ matrix.arch }} templates
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up SPX build context
        id: spx-build
        uses: ./.github/actions/setup-spx-module/build-context
        with:
          runtime-version: ${{ inputs.runtime_version }}
          runtime-abi: ${{ inputs.runtime_abi }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}
          toolchain-scope: native
          cache-scope: macos-${{ matrix.arch }}-templates

      - name: Build macOS release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            arch=${{ matrix.arch }}
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: macos
          target: template_release

      - name: Build macOS debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            arch=${{ matrix.arch }}
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: macos
          target: template_debug

      - name: Package macOS templates
        shell: bash
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          chmod +x "bin/godot.macos.template_debug.${{ matrix.arch }}"
          chmod +x "bin/godot.macos.template_release.${{ matrix.arch }}"
          mkdir -p artifacts
          zip -j "artifacts/macos-${{ matrix.arch }}.zip" \
            "bin/godot.macos.template_debug.${{ matrix.arch }}" \
            "bin/godot.macos.template_release.${{ matrix.arch }}"
          echo "[info] Packaged macOS ${RUNTIME_VERSION} ${{ matrix.arch }} templates"

      - name: Upload macOS template artifact
        uses: actions/upload-artifact@v5
        with:
          name: runtime-macos-${{ matrix.arch }}
          path: artifacts/macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  macos-template-app-build:
    name: macOS universal export template
    needs: macos-template-build
    runs-on: macos-latest
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: false
          persist-credentials: false

      - name: Download x86_64 templates
        uses: actions/download-artifact@v5
        with:
          name: runtime-macos-x86_64
          path: template-artifacts/x86_64

      - name: Download arm64 templates
        uses: actions/download-artifact@v5
        with:
          name: runtime-macos-arm64
          path: template-artifacts/arm64

      - name: Package universal macOS export template
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p bin
          unzip -j template-artifacts/x86_64/macos-x86_64.zip -d bin
          unzip -j template-artifacts/arm64/macos-arm64.zip -d bin
          for binary in \
            bin/godot.macos.template_release.x86_64 \
            bin/godot.macos.template_debug.x86_64 \
            bin/godot.macos.template_release.arm64 \
            bin/godot.macos.template_debug.arm64; do
            if [ ! -s "${binary}" ]; then
              echo "[error] Missing macOS template binary: ${binary}" >&2
              exit 1
            fi
          done

          lipo -create \
            bin/godot.macos.template_release.x86_64 \
            bin/godot.macos.template_release.arm64 \
            -output bin/godot.macos.template_release.universal
          lipo -create \
            bin/godot.macos.template_debug.x86_64 \
            bin/godot.macos.template_debug.arm64 \
            -output bin/godot.macos.template_debug.universal

          cp -R misc/dist/macos_template.app macos_template.app
          mkdir -p macos_template.app/Contents/MacOS macos_template.app/Contents/Frameworks
          cp bin/godot.macos.template_release.universal macos_template.app/Contents/MacOS/godot_macos_release.universal
          cp bin/godot.macos.template_debug.universal macos_template.app/Contents/MacOS/godot_macos_debug.universal
          chmod +x macos_template.app/Contents/MacOS/godot_macos_*.universal

          mkdir -p artifacts
          zip -q -9 -r artifacts/macos.zip macos_template.app

      - name: Upload universal macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: runtime-macos-universal
          path: artifacts/macos.zip
          if-no-files-found: error
          retention-days: 14
