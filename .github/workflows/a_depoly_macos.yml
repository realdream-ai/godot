name: Build macOS Runtime Artifacts

on:
  workflow_call:
    inputs:
      runtime_version:
        required: true
        type: string
      godot_repository:
        required: true
        type: string
      godot_ref:
        required: true
        type: string
      spx_repository:
        required: true
        type: string
      spx_ref:
        required: true
        type: string
      common_args:
        required: true
        type: string
      release_args:
        required: true
        type: string
      editor_args:
        required: true
        type: string

permissions:
  contents: read

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons_cache/

jobs:
  macos-editor-build:
    name: macOS ${{ matrix.arch }} editor
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up external SPX module
        id: spx-source
        uses: ./.github/actions/setup-spx-module
        with:
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: spx-runtime-macos-${{ matrix.arch }}-${{ steps.spx-source.outputs.godot-sha }}-${{ steps.spx-source.outputs.module-sha }}-editor
          restore-keys: |
            spx-runtime-macos-${{ matrix.arch }}-${{ steps.spx-source.outputs.godot-sha }}-
            spx-runtime-macos-${{ matrix.arch }}-

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          scons-version: 4.8.1

      - name: Build macOS editor
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=macos target=editor arch=${{ matrix.arch }}
            ${{ inputs.common_args }} ${{ inputs.editor_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: macos
          target: editor

      - name: Package macOS editor
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "bin/godot.macos.editor.${{ matrix.arch }}"
          mkdir -p artifacts
          zip -j "artifacts/editor-macos-${{ matrix.arch }}.zip" "bin/godot.macos.editor.${{ matrix.arch }}"

      - name: Upload macOS editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-editor-macos-${{ matrix.arch }}
          path: artifacts/editor-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  macos-template-build:
    name: macOS ${{ matrix.arch }} templates
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up external SPX module
        id: spx-source
        uses: ./.github/actions/setup-spx-module
        with:
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: spx-runtime-macos-${{ matrix.arch }}-${{ steps.spx-source.outputs.godot-sha }}-${{ steps.spx-source.outputs.module-sha }}-templates
          restore-keys: |
            spx-runtime-macos-${{ matrix.arch }}-${{ steps.spx-source.outputs.godot-sha }}-
            spx-runtime-macos-${{ matrix.arch }}-

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          scons-version: 4.8.1

      - name: Build macOS release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=macos target=template_release arch=${{ matrix.arch }}
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: macos
          target: template_release

      - name: Build macOS debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=macos target=template_debug arch=${{ matrix.arch }}
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: macos
          target: template_debug

      - name: Package macOS templates
        shell: bash
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          chmod +x "bin/godot.macos.template_debug.${{ matrix.arch }}"
          chmod +x "bin/godot.macos.template_release.${{ matrix.arch }}"
          mkdir -p artifacts
          zip -j "artifacts/macos-${{ matrix.arch }}.zip" \
            "bin/godot.macos.template_debug.${{ matrix.arch }}" \
            "bin/godot.macos.template_release.${{ matrix.arch }}"
          echo "[info] Packaged macOS ${RUNTIME_VERSION} ${{ matrix.arch }} templates"

      - name: Upload macOS template artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-macos-${{ matrix.arch }}
          path: artifacts/macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  macos-template-app-build:
    name: macOS universal export template
    runs-on: macos-latest
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up external SPX module
        id: spx-source
        uses: ./.github/actions/setup-spx-module
        with:
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: spx-runtime-macos-universal-${{ steps.spx-source.outputs.godot-sha }}-${{ steps.spx-source.outputs.module-sha }}
          restore-keys: |
            spx-runtime-macos-universal-${{ steps.spx-source.outputs.godot-sha }}-
            spx-runtime-macos-universal-

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          scons-version: 4.8.1

      - name: Build macOS x86_64 release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=macos target=template_release arch=x86_64
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: macos
          target: template_release

      - name: Build macOS x86_64 debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=macos target=template_debug arch=x86_64
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: macos
          target: template_debug

      - name: Build macOS arm64 release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=macos target=template_release arch=arm64
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: macos
          target: template_release

      - name: Build macOS arm64 debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=macos target=template_debug arch=arm64
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: macos
          target: template_debug

      - name: Package universal macOS export template
        shell: bash
        run: |
          set -euo pipefail
          lipo -create \
            bin/godot.macos.template_release.x86_64 \
            bin/godot.macos.template_release.arm64 \
            -output bin/godot.macos.template_release.universal
          lipo -create \
            bin/godot.macos.template_debug.x86_64 \
            bin/godot.macos.template_debug.arm64 \
            -output bin/godot.macos.template_debug.universal

          cp -R misc/dist/macos_template.app macos_template.app
          mkdir -p macos_template.app/Contents/MacOS macos_template.app/Contents/Frameworks
          cp bin/godot.macos.template_release.universal macos_template.app/Contents/MacOS/godot_macos_release.universal
          cp bin/godot.macos.template_debug.universal macos_template.app/Contents/MacOS/godot_macos_debug.universal
          chmod +x macos_template.app/Contents/MacOS/godot_macos_*.universal

          mkdir -p artifacts
          zip -q -9 -r artifacts/macos.zip macos_template.app

      - name: Upload universal macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-macos-universal
          path: artifacts/macos.zip
          if-no-files-found: error
          retention-days: 14
