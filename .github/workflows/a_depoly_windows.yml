name: Build Windows Runtime Artifacts

on:
  workflow_call:
    inputs:
      runtime_version:
        required: true
        type: string
      godot_repository:
        required: true
        type: string
      godot_ref:
        required: true
        type: string
      spx_repository:
        required: true
        type: string
      spx_ref:
        required: true
        type: string

permissions:
  contents: read

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons_cache/

jobs:
  windows-editor-build:
    name: Windows x86_64 editor
    runs-on: windows-latest
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up external SPX module
        id: spx-source
        uses: ./.github/actions/setup-spx-module
        with:
          runtime-version: ${{ inputs.runtime_version }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: spx-runtime-windows-x86_64-${{ steps.spx-source.outputs.godot-sha }}-${{ steps.spx-source.outputs.module-sha }}-editor
          restore-keys: |
            spx-runtime-windows-x86_64-${{ steps.spx-source.outputs.godot-sha }}-
            spx-runtime-windows-x86_64-

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          scons-version: 4.8.1

      - name: Download pre-built ANGLE
        shell: bash
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows editor
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            arch=x86_64 use_llvm=yes
            angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
            ${{ steps.spx-source.outputs.editor-release-flags }}
          custom-modules: ${{ steps.spx-source.outputs.module-path }}
          platform: windows
          target: editor

      - name: Package Windows editor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path bin/godot.windows.editor.x86_64.exe -DestinationPath artifacts/editor-windows-x86_64.zip

      - name: Upload Windows editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-editor-windows-x86_64
          path: artifacts/editor-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  windows-template-build:
    name: Windows x86_64 templates
    runs-on: windows-latest
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up external SPX module
        id: spx-source
        uses: ./.github/actions/setup-spx-module
        with:
          runtime-version: ${{ inputs.runtime_version }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: spx-runtime-windows-x86_64-${{ steps.spx-source.outputs.godot-sha }}-${{ steps.spx-source.outputs.module-sha }}-templates
          restore-keys: |
            spx-runtime-windows-x86_64-${{ steps.spx-source.outputs.godot-sha }}-
            spx-runtime-windows-x86_64-

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          scons-version: 4.8.1

      - name: Download pre-built ANGLE
        shell: bash
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed, building without ANGLE support."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            arch=x86_64 use_llvm=yes
            angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
            ${{ steps.spx-source.outputs.template-release-flags }}
          custom-modules: ${{ steps.spx-source.outputs.module-path }}
          platform: windows
          target: template_debug

      - name: Build Windows release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            arch=x86_64 use_llvm=yes
            angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
            ${{ steps.spx-source.outputs.template-release-flags }}
          custom-modules: ${{ steps.spx-source.outputs.module-path }}
          platform: windows
          target: template_release

      - name: Package Windows templates
        shell: pwsh
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive `
            -Path bin/godot.windows.template_debug.x86_64.exe,bin/godot.windows.template_release.x86_64.exe `
            -DestinationPath artifacts/windows-x86_64.zip
          Write-Host "[info] Packaged Windows runtime $env:RUNTIME_VERSION"

      - name: Upload Windows template artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-x86_64
          path: artifacts/windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
