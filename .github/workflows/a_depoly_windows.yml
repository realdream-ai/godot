name: Build Windows Runtime Artifacts

on:
  workflow_call:
    inputs:
      runtime_version:
        required: true
        type: string
      runtime_abi:
        required: true
        type: string
      godot_repository:
        required: true
        type: string
      godot_ref:
        required: true
        type: string
      spx_repository:
        required: true
        type: string
      spx_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-editor-build:
    name: Windows x86_64 editor
    runs-on: windows-latest
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up SPX build context
        id: spx-build
        uses: ./.github/actions/setup-spx-module/build-context
        with:
          runtime-version: ${{ inputs.runtime_version }}
          runtime-abi: ${{ inputs.runtime_abi }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}
          toolchain-scope: native
          cache-scope: windows-x86_64-editor

      - name: Install required ANGLE SDK
        shell: bash
        run: |
          set -euo pipefail
          python ./misc/scripts/install_angle.py

      - name: Build Windows editor
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.editor-release-flags }}
            arch=x86_64 use_mingw=yes use_llvm=no
            angle=yes
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: windows
          target: editor

      - name: Package Windows editor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item bin/godot.windows.editor.x86_64.exe artifacts/godot.windows.editor.x86_64.exe
          Compress-Archive -Path artifacts/godot.windows.editor.x86_64.exe -DestinationPath artifacts/editor-windows-x86_64.zip

      - name: Upload Windows editor artifact
        uses: actions/upload-artifact@v5
        with:
          name: runtime-editor-windows-x86_64
          path: artifacts/editor-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  windows-template-build:
    name: Windows x86_64 templates
    runs-on: windows-latest
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up SPX build context
        id: spx-build
        uses: ./.github/actions/setup-spx-module/build-context
        with:
          runtime-version: ${{ inputs.runtime_version }}
          runtime-abi: ${{ inputs.runtime_abi }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}
          toolchain-scope: native
          cache-scope: windows-x86_64-templates

      - name: Install required ANGLE SDK
        shell: bash
        run: |
          set -euo pipefail
          python ./misc/scripts/install_angle.py

      - name: Build Windows debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            arch=x86_64 use_mingw=yes use_llvm=no
            angle=yes
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: windows
          target: template_debug

      - name: Build Windows release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            arch=x86_64 use_mingw=yes use_llvm=no
            angle=yes
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: windows
          target: template_release

      - name: Package Windows templates
        shell: pwsh
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item bin/godot.windows.template_debug.x86_64.exe artifacts/godot.windows.template_debug.x86_64.exe
          Copy-Item bin/godot.windows.template_release.x86_64.exe artifacts/godot.windows.template_release.x86_64.exe
          Compress-Archive `
            -Path artifacts/godot.windows.template_debug.x86_64.exe,artifacts/godot.windows.template_release.x86_64.exe `
            -DestinationPath artifacts/windows-x86_64.zip
          Write-Host "[info] Packaged Windows runtime $env:RUNTIME_VERSION"

      - name: Upload Windows template artifact
        uses: actions/upload-artifact@v5
        with:
          name: runtime-windows-x86_64
          path: artifacts/windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
