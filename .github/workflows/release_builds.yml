name: Build SPX Runtime Artifacts

on:
  workflow_call:
    inputs:
      runtime_version:
        description: Runtime version used to label the build artifacts.
        required: true
        type: string
      platforms:
        description: Comma-separated platforms (android,ios,web,linux,macos,windows,all).
        required: false
        default: all
        type: string
      godot_repository:
        description: Godot repository to build.
        required: true
        type: string
      godot_ref:
        description: Godot branch, tag, or full commit SHA to build.
        required: true
        type: string
      spx_repository:
        description: SPX repository containing the runtime lock and external module.
        required: true
        type: string
      spx_ref:
        description: SPX branch, tag, or full commit SHA supplying the external module.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      runtime_version:
        description: Runtime version used to label the build artifacts.
        required: true
        type: string
      platforms:
        description: Comma-separated platforms (android,ios,web,linux,macos,windows,all).
        required: true
        default: all
        type: string
      godot_repository:
        description: Godot repository to build; empty uses the current repository.
        required: false
        default: ''
        type: string
      godot_ref:
        description: Godot branch, tag, or full commit SHA; empty uses the dispatched commit.
        required: false
        default: ''
        type: string
      spx_repository:
        description: SPX repository containing the runtime lock and external module.
        required: true
        default: goplus/spx
        type: string
      spx_ref:
        description: SPX branch, tag, or full commit SHA supplying the external module.
        required: true
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: spx-runtime-${{ inputs.runtime_version }}-${{ inputs.godot_ref || github.sha }}-${{ inputs.spx_ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve runtime build inputs
    runs-on: ubuntu-22.04
    outputs:
      runtime_version: ${{ steps.inputs.outputs.runtime_version }}
      platforms: ${{ steps.inputs.outputs.platforms }}
      run_android: ${{ steps.inputs.outputs.run_android }}
      run_ios: ${{ steps.inputs.outputs.run_ios }}
      run_web: ${{ steps.inputs.outputs.run_web }}
      run_linux: ${{ steps.inputs.outputs.run_linux }}
      run_macos: ${{ steps.inputs.outputs.run_macos }}
      run_windows: ${{ steps.inputs.outputs.run_windows }}
      godot_repository: ${{ steps.inputs.outputs.godot_repository }}
      godot_ref: ${{ steps.inputs.outputs.godot_ref }}
      spx_repository: ${{ steps.inputs.outputs.spx_repository }}
      spx_ref: ${{ steps.inputs.outputs.spx_ref }}
    steps:
      - name: Validate inputs
        id: inputs
        shell: bash
        env:
          INPUT_RUNTIME_VERSION: ${{ inputs.runtime_version }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_GODOT_REPOSITORY: ${{ inputs.godot_repository }}
          INPUT_GODOT_REF: ${{ inputs.godot_ref }}
          INPUT_SPX_REPOSITORY: ${{ inputs.spx_repository }}
          INPUT_SPX_REF: ${{ inputs.spx_ref }}
        run: |
          set -euo pipefail

          runtime_version="${INPUT_RUNTIME_VERSION#v}"
          if [[ ! "${runtime_version}" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "[error] Invalid runtime version: ${INPUT_RUNTIME_VERSION}" >&2
            exit 1
          fi

          godot_repository="${INPUT_GODOT_REPOSITORY:-${GITHUB_REPOSITORY}}"
          godot_ref="${INPUT_GODOT_REF:-${GITHUB_SHA}}"
          if [ -z "${INPUT_SPX_REPOSITORY}" ] || [ -z "${INPUT_SPX_REF}" ]; then
            echo "[error] spx_repository and spx_ref are required" >&2
            exit 1
          fi

          raw_platforms="$(printf '%s' "${INPUT_PLATFORMS:-all}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ "${raw_platforms}" = all ]; then
            raw_platforms="android,ios,web,linux,macos,windows"
          fi

          run_android=false
          run_ios=false
          run_web=false
          run_linux=false
          run_macos=false
          run_windows=false
          IFS=',' read -r -a requested_platforms <<< "${raw_platforms}"
          for platform in "${requested_platforms[@]}"; do
            case "${platform}" in
              android) run_android=true ;;
              ios) run_ios=true ;;
              web) run_web=true ;;
              linux) run_linux=true ;;
              macos) run_macos=true ;;
              windows) run_windows=true ;;
              *)
                echo "[error] Unsupported platform: ${platform}" >&2
                exit 1
                ;;
            esac
          done

          echo "runtime_version=${runtime_version}" >> "${GITHUB_OUTPUT}"
          echo "platforms=${raw_platforms}" >> "${GITHUB_OUTPUT}"
          echo "run_android=${run_android}" >> "${GITHUB_OUTPUT}"
          echo "run_ios=${run_ios}" >> "${GITHUB_OUTPUT}"
          echo "run_web=${run_web}" >> "${GITHUB_OUTPUT}"
          echo "run_linux=${run_linux}" >> "${GITHUB_OUTPUT}"
          echo "run_macos=${run_macos}" >> "${GITHUB_OUTPUT}"
          echo "run_windows=${run_windows}" >> "${GITHUB_OUTPUT}"
          echo "godot_repository=${godot_repository}" >> "${GITHUB_OUTPUT}"
          echo "godot_ref=${godot_ref}" >> "${GITHUB_OUTPUT}"
          echo "spx_repository=${INPUT_SPX_REPOSITORY}" >> "${GITHUB_OUTPUT}"
          echo "spx_ref=${INPUT_SPX_REF}" >> "${GITHUB_OUTPUT}"

  android-build:
    name: Android artifacts
    needs: setup
    if: needs.setup.outputs.run_android == 'true'
    uses: ./.github/workflows/a_depoly_android.yml
    with:
      runtime_version: ${{ needs.setup.outputs.runtime_version }}
      godot_repository: ${{ needs.setup.outputs.godot_repository }}
      godot_ref: ${{ needs.setup.outputs.godot_ref }}
      spx_repository: ${{ needs.setup.outputs.spx_repository }}
      spx_ref: ${{ needs.setup.outputs.spx_ref }}

  ios-build:
    name: iOS artifacts
    needs: setup
    if: needs.setup.outputs.run_ios == 'true'
    uses: ./.github/workflows/a_depoly_ios.yml
    with:
      runtime_version: ${{ needs.setup.outputs.runtime_version }}
      godot_repository: ${{ needs.setup.outputs.godot_repository }}
      godot_ref: ${{ needs.setup.outputs.godot_ref }}
      spx_repository: ${{ needs.setup.outputs.spx_repository }}
      spx_ref: ${{ needs.setup.outputs.spx_ref }}

  windows-build:
    name: Windows artifacts
    needs: setup
    if: needs.setup.outputs.run_windows == 'true'
    uses: ./.github/workflows/a_depoly_windows.yml
    with:
      runtime_version: ${{ needs.setup.outputs.runtime_version }}
      godot_repository: ${{ needs.setup.outputs.godot_repository }}
      godot_ref: ${{ needs.setup.outputs.godot_ref }}
      spx_repository: ${{ needs.setup.outputs.spx_repository }}
      spx_ref: ${{ needs.setup.outputs.spx_ref }}

  linux-build:
    name: Linux artifacts
    needs: setup
    if: needs.setup.outputs.run_linux == 'true'
    uses: ./.github/workflows/a_depoly_linux.yml
    with:
      runtime_version: ${{ needs.setup.outputs.runtime_version }}
      godot_repository: ${{ needs.setup.outputs.godot_repository }}
      godot_ref: ${{ needs.setup.outputs.godot_ref }}
      spx_repository: ${{ needs.setup.outputs.spx_repository }}
      spx_ref: ${{ needs.setup.outputs.spx_ref }}

  macos-build:
    name: macOS artifacts
    needs: setup
    if: needs.setup.outputs.run_macos == 'true'
    uses: ./.github/workflows/a_depoly_macos.yml
    with:
      runtime_version: ${{ needs.setup.outputs.runtime_version }}
      godot_repository: ${{ needs.setup.outputs.godot_repository }}
      godot_ref: ${{ needs.setup.outputs.godot_ref }}
      spx_repository: ${{ needs.setup.outputs.spx_repository }}
      spx_ref: ${{ needs.setup.outputs.spx_ref }}

  web-build:
    name: Web artifacts
    needs: setup
    if: needs.setup.outputs.run_web == 'true'
    uses: ./.github/workflows/a_depoly_web.yml
    with:
      runtime_version: ${{ needs.setup.outputs.runtime_version }}
      godot_repository: ${{ needs.setup.outputs.godot_repository }}
      godot_ref: ${{ needs.setup.outputs.godot_ref }}
      spx_repository: ${{ needs.setup.outputs.spx_repository }}
      spx_ref: ${{ needs.setup.outputs.spx_ref }}
