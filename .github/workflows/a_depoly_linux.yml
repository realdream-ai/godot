name: Build Linux Runtime Artifacts

on:
  workflow_call:
    inputs:
      runtime_version:
        required: true
        type: string
      godot_repository:
        required: true
        type: string
      godot_ref:
        required: true
        type: string
      spx_repository:
        required: true
        type: string
      spx_ref:
        required: true
        type: string
      common_args:
        required: true
        type: string
      release_args:
        required: true
        type: string

permissions:
  contents: read

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons_cache/

jobs:
  linux-editor-build:
    name: Linux x86_64 editor
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up external SPX module
        id: spx-source
        uses: ./.github/actions/setup-spx-module
        with:
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: spx-runtime-linux-x86_64-${{ steps.spx-source.outputs.godot-sha }}-${{ steps.spx-source.outputs.module-sha }}-editor
          restore-keys: |
            spx-runtime-linux-x86_64-${{ steps.spx-source.outputs.godot-sha }}-
            spx-runtime-linux-x86_64-

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          scons-version: 4.8.1

      - name: Build Linux editor
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=linuxbsd target=editor arch=x86_64 use_llvm=yes linker=lld
            ${{ inputs.common_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: linuxbsd
          target: editor

      - name: Package Linux editor
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/godot.linuxbsd.editor.x86_64
          mkdir -p artifacts
          zip -j artifacts/editor-linux-x86_64.zip bin/godot.linuxbsd.editor.x86_64

      - name: Upload Linux editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-editor-linux-x86_64
          path: artifacts/editor-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  linux-template-build:
    name: Linux x86_64 templates
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up external SPX module
        id: spx-source
        uses: ./.github/actions/setup-spx-module
        with:
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: spx-runtime-linux-x86_64-${{ steps.spx-source.outputs.godot-sha }}-${{ steps.spx-source.outputs.module-sha }}-templates
          restore-keys: |
            spx-runtime-linux-x86_64-${{ steps.spx-source.outputs.godot-sha }}-
            spx-runtime-linux-x86_64-

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          scons-version: 4.8.1

      - name: Build Linux debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=linuxbsd target=template_debug arch=x86_64 use_llvm=yes linker=lld
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: linuxbsd
          target: template_debug

      - name: Build Linux release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            platform=linuxbsd target=template_release arch=x86_64 use_llvm=yes linker=lld
            ${{ inputs.common_args }} ${{ inputs.release_args }}
            custom_modules=${{ steps.spx-source.outputs.module-path }} module_spx_enabled=true
          platform: linuxbsd
          target: template_release

      - name: Package Linux templates
        shell: bash
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          chmod +x bin/godot.linuxbsd.template_debug.x86_64
          chmod +x bin/godot.linuxbsd.template_release.x86_64
          mkdir -p artifacts
          zip -j artifacts/linux-x86_64.zip \
            bin/godot.linuxbsd.template_debug.x86_64 \
            bin/godot.linuxbsd.template_release.x86_64
          echo "[info] Packaged Linux runtime ${RUNTIME_VERSION}"

      - name: Upload Linux template artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-linux-x86_64
          path: artifacts/linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14
