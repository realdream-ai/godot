name: Build Linux Runtime Artifacts

on:
  workflow_call:
    inputs:
      runtime_version:
        required: true
        type: string
      runtime_abi:
        required: true
        type: string
      godot_repository:
        required: true
        type: string
      godot_ref:
        required: true
        type: string
      spx_repository:
        required: true
        type: string
      spx_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux-editor-build:
    name: Linux x86_64 editor
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up SPX build context
        id: spx-build
        uses: ./.github/actions/setup-spx-module/build-context
        with:
          runtime-version: ${{ inputs.runtime_version }}
          runtime-abi: ${{ inputs.runtime_abi }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}
          toolchain-scope: native
          cache-scope: linux-x86_64-editor

      - name: Build Linux editor
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.editor-release-flags }}
            arch=x86_64 use_llvm=yes linker=lld
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: linuxbsd
          target: editor

      - name: Package Linux editor
        shell: bash
        run: |
          set -euo pipefail
          chmod +x bin/godot.linuxbsd.editor.x86_64
          mkdir -p artifacts
          zip -j artifacts/editor-linux-x86_64.zip bin/godot.linuxbsd.editor.x86_64

      - name: Upload Linux editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-editor-linux-x86_64
          path: artifacts/editor-linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  linux-template-build:
    name: Linux x86_64 templates
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up SPX build context
        id: spx-build
        uses: ./.github/actions/setup-spx-module/build-context
        with:
          runtime-version: ${{ inputs.runtime_version }}
          runtime-abi: ${{ inputs.runtime_abi }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}
          toolchain-scope: native
          cache-scope: linux-x86_64-templates

      - name: Build Linux debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            arch=x86_64 use_llvm=yes linker=lld
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: linuxbsd
          target: template_debug

      - name: Build Linux release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            arch=x86_64 use_llvm=yes linker=lld
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: linuxbsd
          target: template_release

      - name: Package Linux templates
        shell: bash
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          chmod +x bin/godot.linuxbsd.template_debug.x86_64
          chmod +x bin/godot.linuxbsd.template_release.x86_64
          mkdir -p artifacts
          zip -j artifacts/linux-x86_64.zip \
            bin/godot.linuxbsd.template_debug.x86_64 \
            bin/godot.linuxbsd.template_release.x86_64
          echo "[info] Packaged Linux runtime ${RUNTIME_VERSION}"

      - name: Upload Linux template artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-linux-x86_64
          path: artifacts/linux-x86_64.zip
          if-no-files-found: error
          retention-days: 14
