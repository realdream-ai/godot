name: Build iOS Runtime Artifact

on:
  workflow_call:
    inputs:
      runtime_version:
        required: true
        type: string
      runtime_abi:
        required: true
        type: string
      godot_repository:
        required: true
        type: string
      godot_ref:
        required: true
        type: string
      spx_repository:
        required: true
        type: string
      spx_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ios-build:
    name: iOS templates
    runs-on: macos-latest
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up SPX build context
        id: spx-build
        uses: ./.github/actions/setup-spx-module/build-context
        with:
          runtime-version: ${{ inputs.runtime_version }}
          runtime-abi: ${{ inputs.runtime_abi }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}
          toolchain-scope: native
          cache-scope: ios-templates

      - name: Build iOS simulator arm64 debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            ios_simulator=yes arch=arm64
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: ios
          target: template_debug

      - name: Build iOS simulator arm64 release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            ios_simulator=yes arch=arm64
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: ios
          target: template_release

      - name: Build iOS simulator x86_64 debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            ios_simulator=yes arch=x86_64
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: ios
          target: template_debug

      - name: Build iOS simulator x86_64 release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            ios_simulator=yes arch=x86_64 generate_bundle=yes
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: ios
          target: template_release

      - name: Build iOS device debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            ios_simulator=no
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: ios
          target: template_debug

      - name: Build iOS device release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ${{ steps.spx-build.outputs.template-release-flags }}
            ios_simulator=no generate_bundle=yes
          custom-modules: ${{ steps.spx-build.outputs.module-path }}
          platform: ios
          target: template_release

      - name: Package iOS artifact
        shell: bash
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp bin/godot_ios.zip artifacts/ios.zip
          echo "[info] Packaged iOS runtime ${RUNTIME_VERSION}"
          unzip -l artifacts/ios.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-ios
          path: artifacts/ios.zip
          if-no-files-found: error
          retention-days: 14
