name: Build iOS Runtime Artifact

on:
  workflow_call:
    inputs:
      runtime_version:
        required: true
        type: string
      godot_repository:
        required: true
        type: string
      godot_ref:
        required: true
        type: string
      spx_repository:
        required: true
        type: string
      spx_ref:
        required: true
        type: string

permissions:
  contents: read

env:
  SCONS_CACHE: ${{ github.workspace }}/.scons_cache/

jobs:
  ios-build:
    name: iOS templates
    runs-on: macos-latest
    steps:
      - name: Check out Godot source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.godot_repository }}
          ref: ${{ inputs.godot_ref }}
          submodules: recursive
          persist-credentials: false

      - name: Set up external SPX module
        id: spx-source
        uses: ./.github/actions/setup-spx-module
        with:
          runtime-version: ${{ inputs.runtime_version }}
          repository: ${{ inputs.spx_repository }}
          ref: ${{ inputs.spx_ref }}

      - name: Restore SCons cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE }}
          key: spx-runtime-ios-${{ steps.spx-source.outputs.godot-sha }}-${{ steps.spx-source.outputs.module-sha }}
          restore-keys: |
            spx-runtime-ios-${{ steps.spx-source.outputs.godot-sha }}-
            spx-runtime-ios-

      - name: Set up Python and SCons
        uses: ./.github/actions/godot-deps
        with:
          scons-version: 4.8.1

      - name: Build iOS simulator arm64 debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ios_simulator=yes arch=arm64
            ${{ steps.spx-source.outputs.template-release-flags }}
          custom-modules: ${{ steps.spx-source.outputs.module-path }}
          platform: ios
          target: template_debug

      - name: Build iOS simulator arm64 release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ios_simulator=yes arch=arm64
            ${{ steps.spx-source.outputs.template-release-flags }}
          custom-modules: ${{ steps.spx-source.outputs.module-path }}
          platform: ios
          target: template_release

      - name: Build iOS simulator x86_64 debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ios_simulator=yes arch=x86_64
            ${{ steps.spx-source.outputs.template-release-flags }}
          custom-modules: ${{ steps.spx-source.outputs.module-path }}
          platform: ios
          target: template_debug

      - name: Build iOS simulator x86_64 release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ios_simulator=yes arch=x86_64 generate_bundle=yes
            ${{ steps.spx-source.outputs.template-release-flags }}
          custom-modules: ${{ steps.spx-source.outputs.module-path }}
          platform: ios
          target: template_release

      - name: Build iOS device debug template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ios_simulator=no
            ${{ steps.spx-source.outputs.template-release-flags }}
          custom-modules: ${{ steps.spx-source.outputs.module-path }}
          platform: ios
          target: template_debug

      - name: Build iOS device release template
        uses: ./.github/actions/godot-build
        with:
          sconsflags: >-
            ios_simulator=no generate_bundle=yes
            ${{ steps.spx-source.outputs.template-release-flags }}
          custom-modules: ${{ steps.spx-source.outputs.module-path }}
          platform: ios
          target: template_release

      - name: Package iOS artifact
        shell: bash
        env:
          RUNTIME_VERSION: ${{ inputs.runtime_version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp bin/godot_ios.zip artifacts/ios.zip
          echo "[info] Packaged iOS runtime ${RUNTIME_VERSION}"
          unzip -l artifacts/ios.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: runtime-ios
          path: artifacts/ios.zip
          if-no-files-found: error
          retention-days: 14
