name: Build Godot
description: Build Godot with the provided options.

inputs:
  target:
    description: Build target (editor, template_release, template_debug).
    default: editor
  tests:
    description: Unit tests.
    default: false
    required: false
  platform:
    description: Target platform.
    required: false
  sconsflags:
    description: Additional whitespace-delimited SCons key=value arguments. Shell syntax is not evaluated.
    default: ""
    required: false
  custom-modules:
    description: Absolute path to the external SPX custom module.
    default: ""
    required: false
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
  scons-cache-limit:
    description: The SCons cache size limit.
    # actions/cache has 10 GiB limit, and GitHub runners have a 14 GiB disk.
    # Limit to 7 GiB to avoid having the extracted cache fill the disk.
    default: 7

runs:
  using: composite
  steps:
    - name: SCons Build
      shell: bash
      env:
        BUILD_PLATFORM: ${{ inputs.platform }}
        BUILD_TARGET: ${{ inputs.target }}
        BUILD_TESTS: ${{ inputs.tests }}
        SCONSFLAGS: ${{ inputs.sconsflags }}
        CUSTOM_MODULES: ${{ inputs.custom-modules }}
        SCONS_CACHE: ${{ inputs.scons-cache }}
        SCONS_CACHE_LIMIT: ${{ inputs.scons-cache-limit }}
      run: |
        set -euo pipefail

        if [ -n "${CUSTOM_MODULES}" ] && [ ! -d "${CUSTOM_MODULES}" ]; then
          echo "[error] custom-modules must be an existing directory: ${CUSTOM_MODULES}" >&2
          exit 1
        fi

        extra_scons_args=()
        scons_args=(
          "platform=${BUILD_PLATFORM}"
          "target=${BUILD_TARGET}"
          "tests=${BUILD_TESTS}"
        )
        if [ -n "${SCONSFLAGS}" ]; then
          read -r -a extra_scons_args <<< "${SCONSFLAGS}"
          scons_args+=("${extra_scons_args[@]}")
        fi
        scons_args+=(
          "cache_path=${SCONS_CACHE}"
          "cache_limit=${SCONS_CACHE_LIMIT}"
        )
        if [ -n "${CUSTOM_MODULES}" ]; then
          scons_args+=("custom_modules=${CUSTOM_MODULES}")
        fi

        printf 'Building with arguments:'
        printf ' %q' "${scons_args[@]}"
        printf '\n'

        if [ "${BUILD_TARGET}" != "editor" ]; then
          # Ensure we don't include editor code in export template builds.
          rm -rf editor
        fi

        if [ "${{ github.event.number }}" != "" ]; then
          # Set build identifier with pull request number if available. This is displayed throughout the editor.
          export BUILD_NAME="gh-${{ github.event.number }}"
        else
          export BUILD_NAME="gh"
        fi

        scons "${scons_args[@]}"
        ls -l bin/
